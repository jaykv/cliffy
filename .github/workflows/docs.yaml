name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # the examples gallery embeds these files at build time
      - 'examples/*.yaml'
      - 'mkdocs.yaml'
      - '.github/workflows/docs.yaml'
  workflow_dispatch:

concurrency:
  group: docs
  cancel-in-progress: false

# The site is published with GitHub Pages' own deployment, so Pages must be set to "GitHub Actions"
# under Settings > Pages.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - uses: actions/configure-pages@v6
      - name: Build
        run: uv run --locked --only-group docs zensical build --clean --strict
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
        id: deployment
