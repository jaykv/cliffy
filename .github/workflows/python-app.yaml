name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'cliffy/**'
      - 'tests/**'
      - 'examples/**'
      - '!examples/generated/**'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/python-app.yaml'
  pull_request:
    paths:
      - 'cliffy/**'
      - 'tests/**'
      - 'examples/**'
      - '!examples/generated/**'
      - 'docs/**'
      - 'scripts/**'
      - 'README.md'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Makefile'
      - '.github/workflows/python-app.yaml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  COLUMNS: 120
  # the environment is synced once, explicitly; `uv run` inside the Makefile must not re-resolve it
  UV_NO_SYNC: 1

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install library
        run: uv sync --locked --all-extras
      - name: Code quality
        run: make lint
      - name: Test with pytest
        if: github.ref != 'refs/heads/main' || matrix.python-version != '3.15'
        run: make test
      - name: Test with pytest + coverage
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.15'
        run: make test-cov
      - name: Coverage report
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.15'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # the reference pages and llms.txt are generated; this fails when one is stale and runs every manifest
  # shown in the docs
  docs:
    name: Docs are in sync with the code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Install library
        run: uv sync --locked --all-extras
      - name: Check generated docs and snippets
        run: make docs-check

  # cliffy has to work, lint and pass its tests without the optional `rich` and `ai` extras
  no-extras:
    name: Without extras (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install library without extras
        run: uv sync --locked
      - name: Code quality
        run: make lint
      - name: Test with pytest
        run: make test
