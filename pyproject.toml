[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliffy"
version = "0.7.1"
description = "$ cli load from.yaml"
authors = [{ name = "Jay", email = "jay.github0@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "yaml", "manifest", "generator", "typer", "click", "zipapp", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Shells",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2.1",
    "deepmerge>=2.0",
    "jinja2>=3.1.6",
    "packaging>=24.2",
    "pybash>=0.4.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.2",
    "shiv>=1.0.8",
    "typer>=0.24.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
rich = [
    "rich-click>=1.9.0",
]
ai = [
    "pydantic-ai>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/jaykv/cliffy"
Documentation = "https://jaykv.github.io/cliffy/"
Repository = "https://github.com/jaykv/cliffy"
Issues = "https://github.com/jaykv/cliffy/issues"
Changelog = "https://github.com/jaykv/cliffy/releases"

[project.scripts]
cli = "cliffy.run:run"
cliffy = "cliffy.run:run"

[tool.hatch.build.targets.sdist]
include = ["/cliffy", "/tests", "/examples", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "pytest-mock>=3.14.0",
    "pytest-pretty>=1.3.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
    "tabulate>=0.10.0",
    "types-pyyaml>=6.0.12",
]
docs = [
    "mkdocs-git-committers-plugin-2>=2.5.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.6.0",
    "pymdown-extensions>=10.14",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["cliffy/clis", "examples/generated"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
]

[tool.ruff.lint.per-file-ignores]
# long pydantic Field descriptions feed the published JSON schema verbatim
"cliffy/manifest.py" = ["E501"]
# trailing whitespace lives inside HTML template string literals
"cliffy/doc.py" = ["W293"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",
    # shiv 1.0.8 calls datetime.utcfromtimestamp() (deprecated since Python 3.12)
    "ignore:datetime.datetime.utcfromtimestamp:DeprecationWarning",
    # pydantic-ai 2.x run_sync() calls asyncio.get_event_loop() without a running loop (warns on 3.12/3.13)
    "ignore:There is no current event loop:DeprecationWarning",
    # google-genai (the SDK behind pydantic-ai's `google:` models) compares typing._UnionGenericAlias at import
    # (deprecated since Python 3.14)
    "ignore:'_UnionGenericAlias' is deprecated:DeprecationWarning",
]

[tool.mypy]
plugins = ["pydantic.mypy"]
follow_imports = "silent"
ignore_missing_imports = true
show_error_codes = true
enable_error_code = [
    "truthy-bool", 
    "truthy-iterable", 
    "redundant-expr",
    "unused-awaitable",
    "possibly-undefined",
    "redundant-self"
]
disable_error_code = [
    "type-arg",
    "misc",
    "unused-ignore",
    "no-untyped-call",
    "no-any-return"
]

# https://coverage.readthedocs.io/en/latest/config.html#run
[tool.coverage.run]
include = ["cliffy/**"]
omit = ["cliffy/clis/**"]
branch = true

# https://coverage.readthedocs.io/en/latest/config.html#report
[tool.coverage.report]
skip_covered = true
show_missing = true
ignore_errors = true
precision = 2
exclude_lines = [
    'pragma: no cover',
    'raise NotImplementedError',
    'if TYPE_CHECKING:',
    'if typing.TYPE_CHECKING:',
    '@overload',
    '@typing.overload',
    '@abstractmethod',
    '\(Protocol\):$',
    'typing.assert_never',
    '$\s*assert_never\(',
    'if __name__ == .__main__.:',
]

[tool.uv]
default-groups = ["dev"]
