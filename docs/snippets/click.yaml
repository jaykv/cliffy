name: clicky
version: 0.1.0
help: The same manifest format, rendered with Click
use_click: true

# The generated code imports rich_click, so builds must bundle it
requires:
  - rich-click

commands:
  hello|hi:
    help: Say hello
    params:
      - name: str
      - --times: int = 1
    run: |
      for _ in range(times):
          print(f"hello {name}")

  resize:
    help: Explicit params always become options
    params:
      - name: width
        type: int
        default: 800
        help: Target width
    run: print(width)

  tag:
    help: Raw Click decorators
    params:
      - "@click.option('--loud', is_flag=True, help='Shout the tags')"
      - "@click.argument('tags', nargs=-1)"
    run: |
      for tag in tags:
          print(tag.upper() if loud else tag)

  db.migrate:
    help: Groups work the same way
    run: $ echo "migrating"
