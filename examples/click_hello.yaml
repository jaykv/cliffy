name: clickhello
version: 0.1.0
use_click: true

help: Hello World with Click!
commands:
  hello | hl: $ echo "world"

examples:
  - command: clickhello hello
    description: Print "world".
  - clickhello hl

tests:
  - hello: assert result.exit_code == 0
  - --help: assert "Examples:" in result.output and "$ clickhello hl" in result.output
